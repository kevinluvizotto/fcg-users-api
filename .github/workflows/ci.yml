name: CI - Build and Test (Users API)

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore fcg-users-api.sln

    - name: Build
      run: dotnet build fcg-users-api.sln --configuration Release --no-restore

    - name: Run tests
      run: dotnet test fcg-users-api.sln --configuration Release --verbosity normal
